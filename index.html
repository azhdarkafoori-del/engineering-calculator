<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><meta name="description" content="ماشین حساب علمی و مهندسی"><title>ماشین‌حساب مهندسی</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#121c2e;--line:#293850;--text:#edf4ff;--muted:#94a7c4;--accent:#64e2c1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#1b2d48 0,transparent 42%),var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;min-height:100vh}header,main,footer{max-width:1100px;margin:auto;padding-left:20px;padding-right:20px}header{padding-top:28px;padding-bottom:18px;display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--accent),#72b9ff);display:grid;place-items:center;color:#071420;font-size:25px;font-weight:900}h1{font-size:clamp(21px,3vw,29px);margin:0 0 5px}.sub,.muted{color:var(--muted);font-size:12px}main{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;padding-bottom:32px}.panel{background:#121c2ef2;border:1px solid var(--line);border-radius:20px;overflow:hidden}.display{padding:22px;background:#17243a;border-bottom:1px solid var(--line)}.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);background:#0d1728;color:var(--muted);border-radius:9px;padding:8px 10px;cursor:pointer}.pill.active{color:var(--accent);border-color:#3d8b80}.expr{width:100%;border:0;outline:0;background:transparent;color:#d7e5fb;text-align:left;direction:ltr;font:19px ui-monospace,monospace;padding:24px 0 12px}.result{font-size:clamp(28px,5vw,42px);font-weight:700;direction:ltr;text-align:left;overflow-wrap:anywhere}.error{font-size:18px;color:#ff8f9b}.keys{padding:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.key{border:1px solid #2a3a53;background:#1a2940;color:var(--text);border-radius:11px;min-height:49px;font-size:15px;cursor:pointer}.key:hover{border-color:#64e2c1}.fn{color:#a9baff}.op{color:var(--accent);background:#12312f}.clear{color:#ff8f9b}.equal{background:linear-gradient(135deg,#68e6c1,#72b9ff);color:#071827;font-weight:bold}.side{display:flex;flex-direction:column;gap:18px}.side .panel{padding:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{font-size:16px;margin:0}.select{background:#0d1728;color:var(--text);border:1px solid var(--line);padding:10px;border-radius:10px;width:100%;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.convert{margin-top:12px;padding:14px;background:#0c1727;border:1px solid var(--line);border-radius:12px;direction:ltr;text-align:center;font:700 18px ui-monospace,monospace;color:var(--accent);overflow-wrap:anywhere}.history{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}.item{background:#0d1728;border:1px solid #24344b;border-radius:11px;padding:11px;cursor:pointer;text-align:right}.item div{direction:ltr;text-align:left;overflow-wrap:anywhere}.item .small{color:var(--muted);font:12px ui-monospace,monospace}.item .answer{font:700 16px ui-monospace,monospace;margin-top:5px}.empty{text-align:center;padding:22px;color:var(--muted);font-size:12px}footer{padding-bottom:25px;color:#72839c;font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}@media(max-width:760px){main{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.side .panel:last-child{grid-column:1/-1}}@media(max-width:500px){header,main,footer{padding-left:12px;padding-right:12px}.side{display:flex}.key{min-height:45px;font-size:13px}.keys{gap:6px;padding:10px}.display{padding:17px}}
</style></head><body>
<header><div class="logo">∑</div><div><h1>ماشین‌حساب مهندسی</h1><div class="sub">محاسبات علمی، سریع و دقیق</div></div></header>
<main><section class="panel"><div class="display"><div class="top"><span>عبارت ریاضی</span><div><button id="deg" class="pill active">درجه</button> <button id="rad" class="pill">رادیان</button></div></div><input id="expr" class="expr" placeholder="مثلاً sin(30) + 5^2" autocomplete="off" spellcheck="false"><div id="result" class="result">0</div><div id="msg" class="muted">برای شروع یک عبارت وارد کنید</div></div>
<div class="keys" id="keys"><button class="key fn" data-i="sin(">sin</button><button class="key fn" data-i="cos(">cos</button><button class="key fn" data-i="tan(">tan</button><button class="key fn" data-i="sqrt(">√</button><button class="key clear" data-a="clear">پاک</button><button class="key fn" data-i="asin(">sin⁻¹</button><button class="key fn" data-i="acos(">cos⁻¹</button><button class="key fn" data-i="atan(">tan⁻¹</button><button class="key fn" data-i="log(">log</button><button class="key fn" data-i="ln(">ln</button><button class="key fn" data-i="pi">π</button><button class="key fn" data-i="e">e</button><button class="key fn" data-i="^2">x²</button><button class="key fn" data-i="^">xʸ</button><button class="key fn" data-i="!">n!</button><button class="key" data-i="7">7</button><button class="key" data-i="8">8</button><button class="key" data-i="9">9</button><button class="key op" data-i="/">÷</button><button class="key op" data-i="(">(</button><button class="key" data-i="4">4</button><button class="key" data-i="5">5</button><button class="key" data-i="6">6</button><button class="key op" data-i="*">×</button><button class="key op" data-i=")">)</button><button class="key" data-i="1">1</button><button class="key" data-i="2">2</button><button class="key" data-i="3">3</button><button class="key op" data-i="-">−</button><button class="key op" data-i="%">%</button><button class="key" data-i="0">0</button><button class="key" data-i=".">.</button><button class="key" data-a="back">⌫</button><button class="key op" data-i="+">+</button><button class="key equal" data-a="calc">=</button></div></section>
<aside class="side"><section class="panel"><div class="head"><h2>تبدیل واحد مهندسی</h2><span class="muted">واحدهای رایج</span></div><label class="muted">دسته‌بندی</label><select id="cat" class="select"><option value="length">طول</option><option value="mass">جرم</option><option value="temperature">دما</option><option value="pressure">فشار</option><option value="energy">انرژی</option><option value="power">توان</option></select><div class="grid" style="margin-top:12px"><label class="muted">مقدار<input id="val" class="select" type="number" value="1" step="any" dir="ltr"></label><label class="muted">از واحد<select id="from" class="select"></select></label><label class="muted" style="grid-column:1/-1">به واحد<select id="to" class="select"></select></label></div><div id="converted" class="convert">1000</div></section><section class="panel"><div class="head"><h2>تاریخچه محاسبات</h2><button id="clearHistory" class="pill">پاک‌سازی</button></div><div id="history" class="history"><div class="empty">هنوز محاسبه‌ای ثبت نشده است.</div></div></section></aside></main>
<footer><span>Engineering Calculator · نسخه 1.0</span><span>محاسبات در مرورگر انجام می‌شود؛ داده‌ای ارسال نمی‌شود.</span></footer>
<script>
(()=>{const $=id=>document.getElementById(id),ex=$('expr'),res=$('result'),msg=$('msg');let mode='deg',hist=[];
const fn={sin:x=>Math.sin(mode==='deg'?x*Math.PI/180:x),cos:x=>Math.cos(mode==='deg'?x*Math.PI/180:x),tan:x=>Math.tan(mode==='deg'?x*Math.PI/180:x),asin:x=>mode==='deg'?Math.asin(x)*180/Math.PI:Math.asin(x),acos:x=>mode==='deg'?Math.acos(x)*180/Math.PI:Math.acos(x),atan:x=>mode==='deg'?Math.atan(x)*180/Math.PI:Math.atan(x),sqrt:Math.sqrt,log:Math.log10,ln:Math.log,abs:Math.abs,exp:Math.exp};
function lex(s){s=s.replace(/π/g,'pi').replace(/\s+/g,'');let a=[],i=0;while(i<s.length){let r=s.slice(i),n=r.match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i),w=r.match(/^[a-z]+/i);if(n){a.push({t:'n',v:+n[0]});i+=n[0].length;continue}if(w){let z=w[0].toLowerCase();if(z==='pi')a.push({t:'n',v:Math.PI});else if(z==='e')a.push({t:'n',v:Math.E});else if(fn[z])a.push({t:'f',v:z});else throw Error('تابع ناشناخته: '+z);i+=w[0].length;continue}if('+-*/^()%!'.includes(s[i])){a.push({t:'o',v:s[i++]});continue}throw Error('کاراکتر نامعتبر: '+s[i])}let b=[];for(let x of a){let p=b.at(-1);if(p&&((p.t==='n'||[')', '!'].includes(p.v))&&(x.t==='n'||x.t==='f'||x.v==='(')))b.push({t:'o',v:'*'});b.push(x)}return b}
function parse(s){let a=lex(s),i=0,peek=()=>a[i],eat=()=>a[i++];function primary(){let x=peek();if(!x)throw Error('عبارت ناقص است');if(x.t==='o'&&'+-'.includes(x.v)){eat();return (x.v==='-'?-1:1)*primary()}if(x.t==='n'){eat();return x.v}if(x.t==='f'){eat();if(eat()?.v!=='(')throw Error('پس از تابع پرانتز بگذارید');let v=add();if(eat()?.v!==')')throw Error('پرانتز بسته نشده است');return fn[x.v](v)}if(x.v==='('){eat();let v=add();if(eat()?.v!==')')throw Error('پرانتز بسته نشده است');return v}throw Error('انتظار عدد یا تابع می‌رفت')}function post(){let v=primary();while(peek()?.v==='!'){eat();if(!Number.isInteger(v)||v<0||v>170)throw Error('فاکتوریل برای اعداد صحیح ۰ تا ۱۷۰ است');let n=1;for(let j=2;j<=v;j++)n*=j;v=n}return v}function power(){let v=post();if(peek()?.v==='^'){eat();v=Math.pow(v,unary())}return v}function unary(){return power()}function mul(){let v=unary();while(peek()&&'*/%'.includes(peek().v)){let o=eat().v,b=unary();if((o==='/'||o==='%')&&b===0)throw Error('تقسیم بر صفر مجاز نیست');v=o==='*'?v*b:o==='/'?v/b:v%b}return v}function add(){let v=mul();while(peek()&&'+-'.includes(peek().v)){let o=eat().v,b=mul();v=o==='+'?v+b:v-b}return v}if(!a.length)throw Error('ابتدا یک عبارت وارد کنید');let v=add();if(i<a.length)throw Error('عبارت قابل تفسیر نیست');if(!Number.isFinite(v))throw Error('نتیجه خارج از محدوده است');return Object.is(v,-0)?0:v}
function fmt(v){return Number(v).toLocaleString('en-US',{maximumFractionDigits:12,useGrouping:false})}
function calc(){try{let v=parse(ex.value),s=fmt(v);res.classList.remove('error');res.textContent=s;msg.textContent='محاسبه با موفقیت انجام شد';hist.unshift([ex.value,s]);hist=hist.slice(0,30);draw()}catch(e){res.classList.add('error');res.textContent=e.message;msg.textContent='لطفاً عبارت را بررسی کنید'}}
$('keys').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.i!==undefined){let a=ex.selectionStart,z=ex.selectionEnd;ex.setRangeText(b.dataset.i,a,z,'end');ex.focus()}else if(b.dataset.a==='clear'){ex.value='';res.classList.remove('error');res.textContent='0';msg.textContent='برای شروع یک عبارت وارد کنید'}else if(b.dataset.a==='back'){let a=ex.selectionStart,z=ex.selectionEnd;if(a===z&&a>0)ex.setRangeText('',a-1,a,'end');else ex.setRangeText('',a,z,'end');ex.focus()}else calc()};ex.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();calc()}if(e.key==='Escape')ex.value=''};
function setMode(m){mode=m;$('deg').classList.toggle('active',m==='deg');$('rad').classList.toggle('active',m==='rad');msg.textContent='حالت زاویه: '+(m==='deg'?'درجه':'رادیان')} $('deg').onclick=()=>setMode('deg');$('rad').onclick=()=>setMode('rad');
function draw(){let h=$('history');h.replaceChildren();if(!hist.length){h.innerHTML='<div class="empty">هنوز محاسبه‌ای ثبت نشده است.</div>';return}hist.forEach(([a,b])=>{let el=document.createElement('button');el.className='item';let x=document.createElement('div');x.className='small';x.textContent=a;let y=document.createElement('div');y.className='answer';y.textContent='= '+b;el.append(x,y);el.onclick=()=>{ex.value=a;res.classList.remove('error');res.textContent=b};h.append(el)})}$('clearHistory').onclick=()=>{hist=[];draw()};
const units={length:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254},mass:{kg:1,g:.001,mg:.000001,lb:.45359237,oz:.028349523125},temperature:{C:'C',F:'F',K:'K'},pressure:{Pa:1,kPa:1000,bar:1e5,atm:101325,psi:6894.757293},energy:{J:1,kJ:1000,cal:4.184,kcal:4184,Wh:3600,kWh:3600000,eV:1.602176634e-19},power:{W:1,kW:1000,MW:1e6,hp:745.6998716}};
const names={length:{m:'متر (m)',km:'کیلومتر (km)',cm:'سانتی‌متر (cm)',mm:'میلی‌متر (mm)',mi:'مایل (mi)',ft:'فوت (ft)',in:'اینچ (in)'},mass:{kg:'کیلوگرم (kg)',g:'گرم (g)',mg:'میلی‌گرم (mg)',lb:'پوند (lb)',oz:'اونس (oz)'},temperature:{C:'سلسیوس (°C)',F:'فارنهایت (°F)',K:'کلوین (K)'},pressure:{Pa:'پاسکال (Pa)',kPa:'کیلوپاسکال (kPa)',bar:'بار (bar)',atm:'اتمسفر (atm)',psi:'psi'},energy:{J:'ژول (J)',kJ:'کیلوژول (kJ)',cal:'کالری (cal)',kcal:'کیلوکالری (kcal)',Wh:'وات‌ساعت (Wh)',kWh:'کیلووات‌ساعت (kWh)',eV:'الکترون‌ولت (eV)'},power:{W:'وات (W)',kW:'کیلووات (kW)',MW:'مگاوات (MW)',hp:'اسب‌بخار (hp)'}};
function fill(){let c=$('cat').value;for(let id of ['from','to']){let el=$(id);el.replaceChildren();Object.keys(units[c]).forEach(k=>el.add(new Option(names[c][k],k)))}$('to').selectedIndex=Math.min(1,$('to').length-1);convert()}function convert(){let c=$('cat').value,a=$('from').value,b=$('to').value,n=Number($('val').value);if($('val').value.trim()===''||!Number.isFinite(n)){$('converted').textContent='—';return}let v;if(c==='temperature'){let k=a==='C'?n+273.15:a==='F'?(n-32)*5/9+273.15:n;v=b==='C'?k-273.15:b==='F'?(k-273.15)*9/5+32:k}else v=n*units[c][a]/units[c][b];$('converted').textContent=Number.isFinite(v)?Number(v).toPrecision(10).replace(/\.?0+$/,''):'خارج از محدوده'}$('cat').onchange=fill;['from','to','val'].forEach(id=>$(id).addEventListener('input',convert));fill();
})();
</script></body></html>
